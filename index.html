<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Booking Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; }
    .booking-card { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="number"], select, input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .radio-group { display: flex; gap: 20px; }
    .radio-group label { font-weight: normal; }
    .adult-block { background: #eef2f5; padding: 15px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #007bff; }
    .adult-block h4 { margin: 0 0 10px 0; color: #007bff; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

<div class="booking-card">
  <h2>Room Booking</h2>
  <form id="bookingForm">
    
    <!-- Room Type Selection -->
    <div class="form-group">
      <label>Room Category:</label>
      <div class="radio-group">
        <label><input type="radio" name="roomType" value="AC" checked> AC</label>
        <label><input type="radio" name="roomType" value="Non-AC"> Non-AC</label>
      </div>
    </div>

    <!-- Guest Counts -->
    <div class="form-group">
      <label for="adultCount">Number of Adults (18+ yrs):</label>
      <input type="number" id="adultCount" min="1" max="10" value="1" required>
    </div>

    <div class="form-group">
      <label for="childCount">Number of Children (Optional details):</label>
      <input type="number" id="childCount" min="0" max="10" value="0">
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

    <!-- Dynamic Adult Fields Container -->
    <div id="adultsContainer"></div>

    <button type="submit">Submit Booking</button>
  </form>
</div>

<script>
  const adultCountInput = document.getElementById('adultCount');
  const adultsContainer = document.getElementById('adultsContainer');

  // Function to render inputs dynamically based on count
  function updateAdultFields() {
    const count = parseInt(adultCountInput.value) || 1;
    adultsContainer.innerHTML = ''; // Clear previous inputs

    for (let i = 1; i <= count; i++) {
      const adultCard = document.createElement('div');
      adultCard.className = 'adult-block';
      adultCard.innerHTML = `
        <h4>Adult ${i} Details *</h4>
        <div class="form-group">
          <input type="text" placeholder="Full Name" name="adult_${i}_name" required>
        </div>
        <div class="form-group">
          <input type="number" placeholder="Age" name="adult_${i}_age" min="18" required>
        </div>
        <div class="form-group">
          <input type="text" placeholder="Government ID / Passport No." name="adult_${i}_id" required>
        </div>
      `;
      adultsContainer.appendChild(adultCard);
    }
  }

  // Initial render
  updateAdultFields();

  // Listen for changes to the adult count input
  adultCountInput.addEventListener('input', updateAdultFields);

  // Form submission handling
  document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const data = Object.fromEntries(formData.entries());
    
    console.log("Submitted Booking Data:", data);
    alert("Form submitted successfully! Check browser console for full output data.");
  });
</script>

</body>
</html>
