<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Room Management</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        background: #f5f6fa;
        color: #222;
    }

    .container {
        width: 95%;
        max-width: 1200px;
        margin: 30px auto;
    }

    h1 {
        margin-bottom: 20px;
    }

    .table-box {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid #eee;
    }

    th {
        background: #f1f3f6;
    }

    .status {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
        display: inline-block;
    }

    .available {
        background: #dff7e5;
        color: #16803c;
    }

    .occupied {
        background: #ffe0e0;
        color: #c62828;
    }

    .cleaning {
        background: #fff1c7;
        color: #9a6800;
    }

    button {
        border: none;
        padding: 9px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        margin-right: 5px;
    }

    .checkin-btn {
        background: #1976d2;
        color: white;
    }

    .checkout-btn {
        background: #d32f2f;
        color: white;
    }

    .clean-btn {
        background: #388e3c;
        color: white;
    }

    .status-btn {
        background: #555;
        color: white;
    }

    button:disabled {
        background: #ccc;
        cursor: not-allowed;
    }

    /* Modal */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .modal-content {
        background: white;
        width: 400px;
        max-width: 90%;
        padding: 25px;
        border-radius: 12px;
    }

    .modal-content h2 {
        margin-top: 0;
    }

    input, select {
        width: 100%;
        padding: 11px;
        margin: 8px 0 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    .save-btn {
        background: #1976d2;
        color: white;
    }

    .cancel-btn {
        background: #ddd;
    }

    .guest-name {
        font-weight: bold;
    }

    .empty {
        color: #777;
    }
</style>
</head>

<body>

<div class="container">

    <h1>🏨 Hotel Room Management</h1>

    <div class="table-box">

        <table>
            <thead>
                <tr>
                    <th>Room</th>
                    <th>Type</th>
                    <th>Guest</th>
                    <th>Check-in</th>
                    <th>Check-out</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="roomTable">
            </tbody>
        </table>

    </div>
</div>


<!-- CHECK-IN MODAL -->

<div class="modal" id="checkinModal">

    <div class="modal-content">

        <h2>Check-in Guest</h2>

        <input type="hidden" id="selectedRoom">

        <label>Guest Name</label>
        <input type="text" id="guestName" placeholder="Enter guest name">

        <label>Check-in Date</label>
        <input type="date" id="checkinDate">

        <label>Check-out Date</label>
        <input type="date" id="checkoutDate">

        <button class="save-btn" onclick="confirmCheckin()">
            Confirm Check-in
        </button>

        <button class="cancel-btn" onclick="closeModal()">
            Cancel
        </button>

    </div>

</div>


<script>

let rooms = [

    {
        number: "101",
        type: "Single",
        status: "Available",
        guest: "",
        checkin: "",
        checkout: ""
    },

    {
        number: "102",
        type: "Double",
        status: "Available",
        guest: "",
        checkin: "",
        checkout: ""
    },

    {
        number: "103",
        type: "Deluxe",
        status: "Available",
        guest: "",
        checkin: "",
        checkout: ""
    },

    {
        number: "104",
        type: "Double",
        status: "Available",
        guest: "",
        checkin: "",
        checkout: ""
    },

    {
        number: "105",
        type: "Suite",
        status: "Available",
        guest: "",
        checkin: "",
        checkout: ""
    }

];


// DISPLAY ROOMS

function displayRooms() {

    const table = document.getElementById("roomTable");

    table.innerHTML = "";

    rooms.forEach((room, index) => {

        let statusClass = "";

        if (room.status === "Available") {
            statusClass = "available";
        }

        if (room.status === "Occupied") {
            statusClass = "occupied";
        }

        if (room.status === "Need to Clean") {
            statusClass = "cleaning";
        }

        let action = "";

        // AVAILABLE ROOM
        if (room.status === "Available") {

            action = `
                <button
                    class="checkin-btn"
                    onclick="openCheckin(${index})">
                    Check-in
                </button>

                <button
                    class="status-btn"
                    onclick="changeStatus(${index})">
                    Change Status
                </button>
            `;
        }

        // OCCUPIED ROOM
        else if (room.status === "Occupied") {

            action = `
                <button
                    class="checkout-btn"
                    onclick="checkout(${index})">
                    Checkout
                </button>
            `;
        }

        // NEED CLEANING
        else if (room.status === "Need to Clean") {

            action = `
                <button
                    class="clean-btn"
                    onclick="markClean(${index})">
                    Mark Clean
                </button>
            `;
        }

        table.innerHTML += `

            <tr>

                <td>
                    <strong>${room.number}</strong>
                </td>

                <td>
                    ${room.type}
                </td>

                <td>
                    ${
                        room.guest
                        ? `<span class="guest-name">${room.guest}</span>`
                        : `<span class="empty">—</span>`
                    }
                </td>

                <td>
                    ${room.checkin || "—"}
                </td>

                <td>
                    ${room.checkout || "—"}
                </td>

                <td>
                    <span class="status ${statusClass}">
                        ${room.status}
                    </span>
                </td>

                <td>
                    ${action}
                </td>

            </tr>

        `;

    });

}


// OPEN CHECK-IN

function openCheckin(index) {

    document.getElementById("selectedRoom").value = index;

    document.getElementById("guestName").value = "";

    document.getElementById("checkinDate").value = "";

    document.getElementById("checkoutDate").value = "";

    document.getElementById("checkinModal").style.display = "flex";
}


// CLOSE MODAL

function closeModal() {

    document.getElementById("checkinModal").style.display = "none";

}


// CONFIRM CHECK-IN

function confirmCheckin() {

    const index =
        document.getElementById("selectedRoom").value;

    const guest =
        document.getElementById("guestName").value.trim();

    const checkin =
        document.getElementById("checkinDate").value;

    const checkout =
        document.getElementById("checkoutDate").value;


    if (!guest) {

        alert("Please enter guest name.");

        return;
    }


    if (!checkin || !checkout) {

        alert("Please select check-in and check-out dates.");

        return;
    }


    rooms[index].guest = guest;

    rooms[index].checkin = checkin;

    rooms[index].checkout = checkout;

    rooms[index].status = "Occupied";


    closeModal();

    displayRooms();

}


// CHECKOUT

function checkout(index) {

    const room = rooms[index];

    const confirmCheckout = confirm(
        `Checkout ${room.guest} from Room ${room.number}?`
    );


    if (!confirmCheckout) {
        return;
    }


    // Clear guest information

    room.guest = "";

    room.checkin = "";

    room.checkout = "";


    // IMPORTANT:
    // After checkout room does NOT become available.
    // It needs cleaning first.

    room.status = "Need to Clean";


    displayRooms();
}


// MARK ROOM CLEAN

function markClean(index) {

    const room = rooms[index];

    const confirmClean = confirm(
        `Mark Room ${room.number} as clean and available?`
    );


    if (!confirmClean) {
        return;
    }


    room.status = "Available";

    displayRooms();
}


// CHANGE ROOM STATUS

function changeStatus(index) {

    const room = rooms[index];


    const newStatus = prompt(
        `Change status for Room ${room.number}.\n\n` +
        `Enter:\n` +
        `Available\n` +
        `Need to Clean`
    );


    if (!newStatus) {
        return;
    }


    if (
        newStatus !== "Available" &&
        newStatus !== "Need to Clean"
    ) {

        alert(
            "Please enter only: Available or Need to Clean"
        );

        return;
    }


    room.status = newStatus;

    displayRooms();
}


// INITIAL DISPLAY

displayRooms();

</script>

</body>
</html>
